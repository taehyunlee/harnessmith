name: Build & Release

# 태그(v0.1.0 형식)를 push 하면 자동으로 Windows 설치파일을 빌드하고
# GitHub Releases 에 업로드합니다. electron-updater 가 이 릴리스를 보고 자동 업데이트합니다.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and publish (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
