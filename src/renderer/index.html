<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
    <title>Harness Forge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">⚙️</div>
          <div>
            <div class="brand-name">Harness Forge</div>
            <div class="brand-sub">나만의 하네스 엔지니어링</div>
          </div>
        </div>

        <button id="newHarnessBtn" class="btn primary block">+ 새 하네스</button>

        <div class="list-header">하네스 목록</div>
        <div id="harnessList" class="harness-list"></div>

        <div class="sidebar-footer">
          <div id="updateStatus" class="update-status">업데이트 상태: 대기</div>
          <button id="checkUpdateBtn" class="btn ghost small block">업데이트 확인</button>
          <div id="appInfo" class="app-info"></div>
        </div>
      </aside>

      <main class="content">
        <div id="emptyState" class="empty-state">
          <h2>하네스를 선택하거나 새로 만드세요</h2>
          <p>
            <strong>API 테스트 하네스</strong>는 HTTP 요청을 보내고 응답(상태·본문·JSON 필드·응답시간)을 검증합니다.<br />
            <strong>코드 검증 하네스</strong>는 셸 명령(테스트·빌드·AI 생성 코드 실행)을 돌려 종료코드·출력을 검증합니다.
          </p>
        </div>

        <div id="editor" class="editor hidden">
          <div class="editor-top">
            <input id="harnessName" class="name-input" placeholder="하네스 이름" />
            <select id="harnessType" class="type-select">
              <option value="api">API 테스트</option>
              <option value="code">코드 검증</option>
            </select>
            <div class="spacer"></div>
            <button id="runBtn" class="btn primary">▶ 실행</button>
            <button id="saveBtn" class="btn">저장</button>
            <button id="deleteBtn" class="btn danger">삭제</button>
          </div>

          <div class="editor-body">
            <section class="panel">
              <div class="panel-head">
                <h3>변수 (JSON)</h3>
                <span class="hint">{{변수}} 또는 {{env.KEY}} 로 스텝에서 참조</span>
              </div>
              <textarea id="variables" class="code" spellcheck="false" rows="3">{}</textarea>

              <div class="panel-head">
                <h3>스텝</h3>
                <button id="addStepBtn" class="btn small">+ 스텝 추가</button>
              </div>
              <div id="steps" class="steps"></div>
            </section>

            <section class="panel results-panel">
              <div class="panel-head">
                <h3>실행 결과</h3>
                <span id="resultSummary" class="summary-badge"></span>
              </div>
              <div id="results" class="results"></div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <template id="stepTemplate">
      <div class="step" data-step>
        <div class="step-head">
          <span class="drag">⋮⋮</span>
          <input class="step-name" placeholder="스텝 이름" data-field="name" />
          <select class="step-kind" data-field="kind">
            <option value="http">HTTP 요청</option>
            <option value="shell">셸 명령</option>
          </select>
          <button class="btn tiny danger" data-action="removeStep">✕</button>
        </div>
        <div class="step-body" data-body></div>
      </div>
    </template>

    <script src="renderer.js"></script>
  </body>
</html>
